function renderCashierReport() {
  if (!needPeriod()) return;
  const yl = S.years.find(y=>y.id===S.yearId)?.year||'';
  const pn = PERIOD_NAMES[S.periodData?.type]||'';
  const rv = S.rates; const swRate = rv.summerWinter||rv.inClass;
  const swLabel = S.periodData?.type==='summer'?'暑期':S.periodData?.type==='winter'?'寒期':'暑/寒期';

  // 依教師彙總節數與費用
  const map = {};
  S.classRecords.forEach(rec => {
    const add = (tid, inC, aft, sw) => {
      if (!tid) return;
      if (!map[tid]) map[tid] = { inClass:0, afterSchool:0, summerWinter:0 };
      map[tid].inClass += inC;
      map[tid].afterSchool += aft;
      map[tid].summerWinter += sw;
    };
    add(rec.teacherId, rec.inClassSessions||0, rec.afterSchoolSessions||0, rec.summerWinterSessions||0);
    add(rec.teacher2Id, rec.t2InClass||0, rec.t2AfterSchool||0, rec.t2SummerWinter||0);
  });
  S.supervisionRecords.forEach(rec => {
    if (!rec.teacherId) return;
    if (!map[rec.teacherId]) map[rec.teacherId] = { inClass:0, afterSchool:0, summerWinter:0 };
    // 監考費計入總計但不佔節數欄
    map[rec.teacherId]._supFee = (map[rec.teacherId]._supFee||0) + (rec.sessions||0)*rv.supervision;
  });

  // 決定顯示欄位
  const hasInClass = Object.values(map).some(d=>d.inClass>0);
  const hasAfterSchool = Object.values(map).some(d=>d.afterSchool>0);
  const hasSW = Object.values(map).some(d=>d.summerWinter>0);

  // 現職排前
  const sorted = Object.entries(map).sort(([idA],[idB])=>{
    const ta=getTch(idA),tb=getTch(idB);
    return ((ta?.type==='現職'||ta?.type==='正式')?0:1)-((tb?.type==='現職'||tb?.type==='正式')?0:1);
  });

  const grandTotal = sorted.reduce(([,d])=>{
    return (d.inClass*rv.inClass + d.afterSchool*rv.afterSchool + d.summerWinter*swRate + (d._supFee||0));
  }, 0);
  // 修正 reduce
  const grandTotalAmt = sorted.reduce((s,[,d])=>s+(d.inClass*rv.inClass+d.afterSchool*rv.afterSchool+d.summerWinter*swRate+(d._supFee||0)),0);

  const hasNoCode = sorted.some(([tid])=>!getTch(tid)?.outnaCode);

  const rateCell = (d) => {
    const rates = new Set();
    if(d.inClass>0) rates.add(rv.inClass);
    if(d.afterSchool>0) rates.add(rv.afterSchool);
    if(d.summerWinter>0) rates.add(swRate);
    return [...rates].map(r=>`$${r}`).join('<br>') || '—';
  };

  const rows = sorted.map(([tid, d]) => {
    const t = getTch(tid);
    const total = d.inClass*rv.inClass + d.afterSchool*rv.afterSchool + d.summerWinter*swRate + (d._supFee||0);
    return `<tr>
      <td>${t?.outnaCode?`<strong>${esc(t.outnaCode)}</strong>`:'<span style="color:var(--danger)">未設定</span>'}</td>
      <td>${t?esc(t.name):'—'}</td>
      <td>${t?`<span class="badge ${(t.type==='現職'||t.type==='正式')?'b-blue':'b-orange'}">${(t.type==='現職'||t.type==='正式')?'現職':'社會人士'}</span>`:'—'}</td>
      <td style="font-size:12px;line-height:1.6">${rateCell(d)}</td>
      ${hasInClass?`<td class="text-r">${d.inClass>0?d.inClass:''}</td>`:''}
      ${hasAfterSchool?`<td class="text-r">${d.afterSchool>0?d.afterSchool:''}</td>`:''}
      ${hasSW?`<td class="text-r">${d.summerWinter>0?d.summerWinter:''}</td>`:''}
      <td class="text-r"><strong>$${total.toLocaleString()}</strong></td>
    </tr>`;
  }).join('');

  const thCols = `<th>代號</th><th>教師姓名</th><th>身份別</th><th>鐘點費</th>${hasInClass?'<th class="text-r">課中節數</th>':''}${hasAfterSchool?'<th class="text-r">課後節數</th>':''}${hasSW?'<th class="text-r">授課節數</th>':''}<th class="text-r">總計</th>`;
  const colCount = 4+(hasInClass?1:0)+(hasAfterSchool?1:0)+(hasSW?1:0)+1;

  pc(`
    <div class="page-header no-print">
      <div><div class="page-title">💳 出納版報表</div><div class="page-sub">代號 · 姓名 · 節數 · 鐘點費</div></div>
      <div class="flex-row no-print">
        <button class="btn btn-success" onclick="exportCashierExcel()">📊 匯出 Excel</button>
        <button class="btn btn-primary" onclick="window.print()">🖨 列印</button>
      </div>
    </div>
    ${hasNoCode?'<div class="alert alert-warning no-print">⚠ 部分教師尚未設定出納代號，請至「教師主表」填入。</div>':''}
    <div class="card">
      <div style="text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid var(--border)">
        <div style="font-size:17px;font-weight:800">后庄國民小學 學習扶助計畫</div>
        <div style="font-size:14px;color:var(--text-muted);margin-top:4px">${yl}學年度 ${pn} 鐘點費清冊</div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>${thCols}</tr></thead>
          <tbody>
            ${rows||'<tr><td colspan="8" class="text-c" style="color:gray">尚無資料</td></tr>'}
            ${sorted.length?`<tr class="tr-total"><td colspan="${colCount-1}">合計</td><td class="text-r">$${grandTotalAmt.toLocaleString()}</td></tr>`:''}
          </tbody>
        </table>
      </div>
    </div>`);
}

async function loadStudents() {
  const snap = await db.collection('students').get();
  S.students = snap.docs.map(d=>({id:d.id,...d.data()}));
  S.students.sort((a,b)=>(a.originClass||'').localeCompare(b.originClass||'','zh-TW')||a.name.localeCompare(b.name,'zh-TW'));
}
async function saveStudent(data, id) {
  if(id) await db.collection('students').doc(id).update(data);
  else await db.collection('students').add({...data, createdAt:ts()});
  await loadStudents();
}
async function delStudent(id) {
  if(!confirm('確定刪除此學生？')) return;
  await db.collection('students').doc(id).delete();
  await loadStudents(); refresh();
}

importStudentRows=[];
function showStudentImportModal() {
  setModal('📥 匯入學生資料',`
    <div class="alert alert-info">Excel 欄位：A編號、B班級、C姓名、D父、E母、F備註</div>
    <div class="fg"><label>選擇檔案（.xlsx / .csv）</label>
    <input type="file" id="stFile" accept=".xlsx,.xls,.csv" onchange="previewStudentImport(this)"></div>
    <div id="stPreview"></div>`,`
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-success" id="doStBtn" style="display:none" onclick="doStudentImport()">✅ 確認匯入</button>`);
}
function previewStudentImport(input) {
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  if(file.name.endsWith('.csv')){reader.onload=e=>processStudentData(e.target.result.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(',').map(c=>c.trim().replace(/^"|"$/g,'')))); reader.readAsText(file,'UTF-8');}
  else{reader.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'}); processStudentData(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));}; reader.readAsArrayBuffer(file);}
}
function processStudentData(data) {
  let start=0; if(data.length>0){const f=String(data[0][0]||''); if(f.includes('編')||f.includes('號')||f==='') start=1;}
  importStudentRows=data.slice(start).filter(r=>String(r[2]||'').trim()).map(r=>({number:String(r[0]||'').trim(),originClass:String(r[1]||'').trim(),name:String(r[2]||'').trim(),father:String(r[3]||'').trim(),mother:String(r[4]||'').trim(),note:String(r[5]||'').trim()}));
  const prev=document.getElementById('stPreview');
  if(!importStudentRows.length){prev.innerHTML='<div class="alert alert-danger">未讀取到有效資料</div>';document.getElementById('doStBtn').style.display='none';return;}
  prev.innerHTML=`<div class="alert alert-success">讀取到 ${importStudentRows.length} 筆</div><div class="tbl-wrap" style="max-height:200px;overflow-y:auto"><table><thead><tr><th>編號</th><th>班級</th><th>姓名</th><th>父</th><th>母</th></tr></thead><tbody>${importStudentRows.map(s=>`<tr><td>${esc(s.number)}</td><td>${esc(s.originClass)}</td><td>${esc(s.name)}</td><td>${esc(s.father)}</td><td>${esc(s.mother)}</td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('doStBtn').style.display='inline-flex';
}
async function doStudentImport() {
  if(!importStudentRows.length) return;
  const btn=document.getElementById('doStBtn'); btn.disabled=true; btn.textContent='匯入中…';
  try{let count=0; for(const s of importStudentRows){if(!S.students.find(x=>x.name===s.name&&x.originClass===s.originClass)){await db.collection('students').add({...s,createdAt:ts()}); count++;}} await loadStudents(); closeModal(); alert(`✅ 新增 ${count} 位，跳過 ${importStudentRows.length-count} 位`); refresh();}
  catch(e){alert('❌ '+e.message); btn.disabled=false; btn.textContent='✅ 確認匯入';}
}
function downloadStudentTemplate() {
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['編號','班級','姓名','父','母','備註'],['001','二甲','王小明','王爸爸 0912-345-678','王媽媽 0912-345-678','']]),'學生名單');

function showEnrollModal(classRecordId) {
  const rec=S.classRecords.find(r=>r.id===classRecordId); if(!rec) return;
  const enrolled=rec.enrolledStudentIds||[];
  const rows=S.students.map(s=>`<label class="strow" style="display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid var(--border);cursor:pointer"><input type="checkbox" value="${s.id}" ${enrolled.includes(s.id)?'checked':''} style="width:auto;min-width:16px"><strong>${esc(s.name)}</strong><span style="font-size:12px;color:var(--text-muted)">${esc(s.originClass||'')}</span></label>`).join('');
  setModal(`編班 — ${esc(rec.className)}`,`
    <div class="fg"><input type="text" id="enrollSearch" placeholder="搜尋..." oninput="filterEnroll()"></div>
    <div id="enrollList" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">${rows||'<p class="text-muted" style="padding:12px">請先至學生管理新增學生</p>'}</div>

    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="submitEnrollment('${classRecordId}')">儲存</button>`);
  setTimeout(()=>{document.querySelectorAll('#enrollList input').forEach(cb=>cb.addEventListener('change',()=>{document.getElementById('enrollCnt').textContent=document.querySelectorAll('#enrollList input:checked').length;}));},100);
}
function filterEnroll() {
  const q=(document.getElementById('enrollSearch')?.value||'').toLowerCase();
  document.querySelectorAll('#enrollList .strow').forEach(row=>{const name=row.querySelector('strong')?.textContent?.toLowerCase()||''; const cls=row.querySelector('span')?.textContent?.toLowerCase()||''; row.style.display=(name.includes(q)||cls.includes(q))?'':'none';});
}
async function submitEnrollment(classRecordId) {
  const checked=[...document.querySelectorAll('#enrollList input:checked')].map(cb=>cb.value);
  try{await db.collection('classRecords').doc(classRecordId).update({enrolledStudentIds:checked}); const rec=S.classRecords.find(r=>r.id===classRecordId); if(rec) rec.enrolledStudentIds=checked; closeModal(); refresh();}
  catch(e){alert('❌ '+e.message);}
}
// ================================================================
// 上課日期管理
// ================================================================
function getWeekdaysInRange(s,e){
  const dates=[],end=new Date(e+'T00:00:00');
  for(let d=new Date(s+'T00:00:00');d<=end;d.setDate(d.getDate()+1)){
    if(d.getDay()&&d.getDay()!==6){
      const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');
      dates.push(`${yr}-${mo}-${dy}`);
    }
  }
  return dates;
}
function showDateManagerModal(classRecordId) {
  const rec=S.classRecords.find(r=>r.id===classRecordId); if(!rec) return;
  const existing=rec.classDates||[];
  const DN=['日','一','二','三','四','五','六'];
  let body='';
  if((S.periodData?.type==='summer'||S.periodData?.type==='winter')&&rec.startDate&&rec.endDate){
    const all=getWeekdaysInRange(rec.startDate,rec.endDate);
    body='<div class="alert alert-info">依起訖日期自動產生平日，請勾選實際上課日期</div><div style="margin-bottom:8px"><button class="btn btn-secondary btn-sm" onclick="toggleAllDates(true)">全選</button> <button class="btn btn-secondary btn-sm" onclick="toggleAllDates(false)">取消全選</button></div><div style="display:flex;flex-wrap:wrap;gap:6px">'+all.map(d=>{const dt=new Date(d+'T00:00:00');return `<label style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:#F0F6FC;border-radius:6px;cursor:pointer;font-size:13px"><input type="checkbox" class="dChk" value="${d}" style="width:auto" ${existing.includes(d)?'checked':''}>${dt.getMonth()+1}/${dt.getDate()}（週${DN[dt.getDay()]}）</label>`;}).join('')+'</div>';
  } else {
    const list=existing.map(d=>{const dt=new Date(d+'T00:00:00');return `<div data-date="${d}" style="display:flex;align-items:center;justify-content:space-between;padding:6px;border-bottom:1px solid var(--border)"><span>${dt.getMonth()+1}/${dt.getDate()}（週${DN[dt.getDay()]}）</span><button class="btn btn-danger btn-sm" onclick="this.closest('[data-date]').remove()">✕</button></div>`;}).join('');
    body=`<div class="flex-row fg"><input type="date" id="newDP" style="flex:1"><button class="btn btn-primary btn-sm" onclick="addDateItem()">新增</button></div><div id="dateList">${list}</div>`;
  }
  setModal(`上課日期 — ${esc(rec.className)}`,body,`<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitDates('${classRecordId}')">儲存</button>`);
}
function toggleAllDates(checked) {
  document.querySelectorAll('.dChk').forEach(cb=>cb.checked=checked);
}
function addDateItem(){const dp=document.getElementById('newDP');if(!dp?.value)return;const d=dp.value,dt=new Date(d+'T00:00:00'),DN=['日','一','二','三','四','五','六'],dl=document.getElementById('dateList');if(dl.querySelector(`[data-date="${d}"]`))return;const div=document.createElement('div');div.setAttribute('data-date',d);div.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:6px;border-bottom:1px solid var(--border)';div.innerHTML=`<span>${dt.getMonth()+1}/${dt.getDate()}（週${DN[dt.getDay()]}）</span><button class="btn btn-danger btn-sm" onclick="this.closest('[data-date]').remove()">✕</button>`;dl.appendChild(div);dp.value='';}
async function submitDates(classRecordId){let dates;const chks=document.querySelectorAll('.dChk');if(chks.length>0){dates=[...chks].filter(c=>c.checked).map(c=>c.value);}else{dates=[...document.querySelectorAll('#dateList [data-date]')].map(el=>el.dataset.date);}dates.sort();try{await db.collection('classRecords').doc(classRecordId).update({classDates:dates});const rec=S.classRecords.find(r=>r.id===classRecordId);if(rec)rec.classDates=dates;closeModal();refresh();}catch(e){alert('❌ '+e.message);}}

function renderSignInPage(){if(!needPeriod())return;const yl=S.years.find(y=>y.id===S.yearId)?.year||'',pn=PERIOD_NAMES[S.periodData?.type]||'';const rows=S.classRecords.map(rec=>{const t=getTch(rec.teacherId),t2=rec.teacher2Id?getTch(rec.teacher2Id):null,dates=rec.classDates||[];return `<tr><td><strong>${esc(rec.className)}</strong></td><td>${t?esc(t.name):'—'}${t2?'<br><span style="font-size:12px;color:var(--text-muted)">'+esc(t2.name)+'</span>':''}</td><td>${esc(rec.classroom||'')}</td><td>${esc(rec.classTime||'—')}</td><td class="text-c"><span class="badge ${dates.length?'b-green':'b-gray'}">${dates.length} 天</span></td><td class="no-print"><button class="btn btn-secondary btn-sm" onclick="showDateManagerModal('${rec.id}')">設定日期</button></td></tr>`;}).join('');pc(`<div class="page-header"><div><div class="page-title">✍ 教師簽到表</div><div class="page-sub">${yl}學年度 ${pn}</div></div><button class="btn btn-success no-print" onclick="exportSignInExcel()">📊 匯出 Excel</button></div><div class="alert alert-info no-print">請先確認各班日期已設定，每班各一張工作表。</div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>班別</th><th>授課教師</th><th>教室</th><th>上課時間</th><th class="text-c">已設定日期</th><th class="no-print">操作</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty"><div class="eico">✍</div><p>尚無班級授課紀錄</p></div></td></tr>'}</tbody></table></div></div>`);}
function exportSignInExcel(){
  const yl=S.years.find(y=>y.id===S.yearId)?.year||'';
  const pn=PERIOD_NAMES[S.periodData?.type]||'';
  try {
  const KT='標楷體',bd={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
  const kc=(v,bold=false,sz=12,align='center',border=true)=>({v:v===null||v===undefined?'':v,t:typeof v==='number'?'n':'s',s:{font:{name:KT,sz,bold},alignment:{horizontal:align,vertical:'center',wrapText:true},border:border?bd:undefined}});
  const wb=XLSX.utils.book_new(),DN=['日','一','二','三','四','五','六'],rv=S.rates,swRate=rv.summerWinter||rv.inClass;
  S.classRecords.forEach(rec=>{const dates=(rec.classDates||[]).slice().sort(),t=getTch(rec.teacherId),t2=rec.teacher2Id?getTch(rec.teacher2Id):null,totalSess=(rec.inClassSessions||0)+(rec.afterSchoolSessions||0)+(rec.summerWinterSessions||0),sessPerDay=dates.length>0?Math.round(totalSess/dates.length):0,rate=(rec.summerWinterSessions||0)>0?swRate:((rec.afterSchoolSessions||0)>0?rv.afterSchool:rv.inClass),teacherStr=(t?t.name:'')+(t2?'/'+t2.name:''),title=`苗栗縣后庄國小${yl}學年度${pn}學習扶助課程教師簽到表`;const data=[[kc(title,true,16,'center',false)],[kc('')],[kc(`授課班級：${rec.className}`,false,13,'left',false)],[kc(`授課教師：${teacherStr}`,false,13,'left',false)],[kc(`授課教室：${rec.classroom||''}`,false,13,'left',false)],[kc('')],['編號','日期','授課時間','鐘點/節','節數','小計','教師簽到'].map(h=>kc(h,true))];let totalFee=0;dates.forEach((d,i)=>{const dt=new Date(d+'T00:00:00'),ds=`${dt.getMonth()+1}/${dt.getDate()}（週${DN[dt.getDay()]}）`,sub=rate*sessPerDay;totalFee+=sub;data.push([kc(i+1),kc(ds),kc(rec.classTime||''),kc(rate),kc(sessPerDay),kc(sub),kc('')]);});data.push([kc(''),kc(''),kc('總計',true),kc(''),kc(''),kc(totalFee,true),kc('')]);const ws=XLSX.utils.aoa_to_sheet(data);ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:6}}];ws['!cols']=[{wch:6},{wch:16},{wch:14},{wch:8},{wch:6},{wch:10},{wch:16}];const sn=rec.className.substring(0,28);
    let finalName=sn, cnt=1;
    while(wb.SheetNames.includes(finalName)){finalName=sn.substring(0,25)+'_'+cnt; cnt++;}
    XLSX.utils.book_append_sheet(wb,ws,finalName);});if(!wb.SheetNames.length){alert('尚無班級資料');return;}
  XLSX.writeFile(wb,`${yl}學年度${pn}_教師簽到表.xlsx`,{cellStyles:true});
  } catch(e){alert('❌ 匯出失敗：'+e.message);}
}

function renderAttendancePage(){if(!needPeriod())return;const yl=S.years.find(y=>y.id===S.yearId)?.year||'',pn=PERIOD_NAMES[S.periodData?.type]||'';const rows=S.classRecords.map(rec=>{const cnt=(rec.enrolledStudentIds||[]).length,dates=(rec.classDates||[]).length;return `<tr><td><strong>${esc(rec.className)}</strong></td><td><span class="badge ${cnt>=6?'b-green':cnt>0?'b-orange':'b-gray'}">${cnt} 位</span></td><td><span class="badge ${dates?'b-green':'b-gray'}">${dates} 天</span></td><td class="no-print"><button class="btn btn-secondary btn-sm" onclick="showEnrollModal('${rec.id}')">編班</button> <button class="btn btn-secondary btn-sm" onclick="showDateManagerModal('${rec.id}')">日期</button></td></tr>`;}).join('');pc(`<div class="page-header"><div><div class="page-title">📝 學生點名單</div><div class="page-sub">${yl}學年度 ${pn}</div></div><button class="btn btn-success no-print" onclick="exportAttendanceExcel()">📊 匯出 Excel</button></div><div class="alert alert-info no-print">請先完成各班「編班」與「日期」設定，每班各一張工作表（橫式）。</div><div class="card"><div class="tbl-wrap"><table><thead><tr><th>班別</th><th>學生人數</th><th>上課天數</th><th class="no-print">操作</th></tr></thead><tbody>${rows||'<tr><td colspan="4"><div class="empty"><div class="eico">📝</div><p>尚無班級授課紀錄</p></div></td></tr>'}</tbody></table></div></div>`);}
function exportAttendanceExcel(){
  const yl=S.years.find(y=>y.id===S.yearId)?.year||'';
  const pn=PERIOD_NAMES[S.periodData?.type]||'';
  try {
  const KT='標楷體',bd={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};
  const kc=(v,bold=false,sz=11,align='center')=>({v:v===null||v===undefined?'':v,t:typeof v==='number'?'n':'s',s:{font:{name:KT,sz,bold},alignment:{horizontal:align,vertical:'center',wrapText:true},border:bd}});
  const wb=XLSX.utils.book_new(),DN=['日','一','二','三','四','五','六'],title=`苗栗縣后庄國小${yl}學年度${pn}學習扶助課程學生點名單`;
  S.classRecords.forEach(rec=>{const ids=rec.enrolledStudentIds||[];if(!ids.length)return;const students=ids.map(id=>S.students.find(s=>s.id===id)).filter(Boolean),dates=(rec.classDates||[]).slice().sort(),dateHdrs=dates.map(d=>{const dt=new Date(d+'T00:00:00');return `${dt.getMonth()+1}/${dt.getDate()}`;});const data=[[Object.assign(kc(title,true,14,'center'),{})],['編號','班級','姓名','父','母','備註',...dateHdrs].map(h=>kc(h,true,11)),...students.map((s,i)=>[kc(s.number||String(i+1).padStart(3,'0')),kc(s.originClass||''),kc(s.name,false,11,'left'),kc(s.father||'',false,10,'left'),kc(s.mother||'',false,10,'left'),kc(s.note||''),...dates.map(()=>kc(''))])];const ws=XLSX.utils.aoa_to_sheet(data);ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:5+dates.length}}];ws['!cols']=[{wch:5},{wch:6},{wch:8},{wch:16},{wch:16},{wch:8},...dates.map(()=>({wch:6}))];ws['!pageSetup']={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};const sn2=rec.className.substring(0,28);
    let finalName2=sn2, cnt2=1;
    while(wb.SheetNames.includes(finalName2)){finalName2=sn2.substring(0,25)+'_'+cnt2; cnt2++;}
    XLSX.utils.book_append_sheet(wb,ws,finalName2);});if(!wb.SheetNames.length){alert('尚無含學生的班級，請先完成編班');return;}
  XLSX.writeFile(wb,`${yl}學年度${pn}_學生點名單.xlsx`,{cellStyles:true});
  } catch(e){alert('❌ 匯出失敗：'+e.message);}

function pc(html) { document.getElementById('pageContent').innerHTML = html; }
function v(id) { return document.getElementById(id)?.value?.trim()||''; }
function num(id) { return parseFloat(document.getElementById(id)?.value)||0; }
function ts() { return firebase.firestore.FieldValue.serverTimestamp(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getTch(id) { return S.teachers.find(t=>t.id===id)||null; }

function needPeriod() {
  if (!S.periodId) {
    pc(`<div class="alert alert-warning" style="margin-top:8px">請先在左側選擇<strong>學年度</strong>與<strong>期別</strong>，再進行資料輸入。<br><br><button class="btn btn-primary btn-sm" onclick="showYearMgr()">⚙ 新增學年度 / 期別</button></div>`);
    return false;
  }
  return true;
}

function setModal(title, body, foot) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFoot').innerHTML = foot;
  document.getElementById('modalBg').style.display = 'flex';
}
function closeModal() { document.getElementById('modalBg').style.display = 'none'; }
function openModal() { document.getElementById('modalBg').style.display = 'flex'; }

function go(page) {
  S.page = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  refresh();
}

function refresh() {
  const pages = {
    students: renderStudentsPage,
    teachers: renderTeachersPage, rates: renderRatesPage, classes: renderClassesPage,
    supervision: renderSupervisionPage, adminfee: renderAdminFeePage, vendor: renderVendorPage,
    insurance: renderInsurancePage, summary: renderSummaryPage,
    signin: renderSignInPage, attendance: renderAttendancePage,
    'rpt-acct': renderAccountantReport, 'rpt-cash': renderCashierReport
  };
  const fn = pages[S.page];
  if (fn) fn();
}

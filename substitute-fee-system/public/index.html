<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>超鐘點／專案設定</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>超鐘點／專案設定</h1>
    <div class="topbar">
      <label>學期
        <select id="semesterSelect"></select>
      </label>
      <label>操作人
        <input id="changedByInput" type="text" placeholder="例如：教學組" />
      </label>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="weekly">每週固定規則</button>
    <button class="tab-btn" data-tab="projects">專案</button>
    <button class="tab-btn" data-tab="dateRules">單日例外</button>
    <button class="tab-btn" data-tab="calendar">學校上課日曆</button>
    <button class="tab-btn" data-tab="importExcel">公費代課匯入</button>
  </nav>

  <main>
    <!-- 每週固定規則（超鐘點／專案共用） -->
    <section id="tab-weekly" class="tab-panel active">
      <div class="subtabs">
        <button class="subtab-btn active" data-ruletype="OVERTIME">超鐘點</button>
        <button class="subtab-btn" data-ruletype="PROJECT">專案</button>
      </div>

      <div id="conflictBanner" class="conflict-banner" hidden></div>

      <div class="filters">
        <input id="filterTeacher" type="text" placeholder="搜尋教師姓名" />
        <select id="filterWeekday">
          <option value="">全部星期</option>
          <option value="MON">星期一</option>
          <option value="TUE">星期二</option>
          <option value="WED">星期三</option>
          <option value="THU">星期四</option>
          <option value="FRI">星期五</option>
        </select>
        <select id="filterProject">
          <option value="">全部專案</option>
        </select>
        <button id="btnNewWeeklyRule">＋ 新增規則</button>
      </div>

      <table id="weeklyRuleTable">
        <thead>
          <tr>
            <th>教師</th><th>星期</th><th>節次</th><th>科目</th><th>類型</th><th>專案</th>
            <th>每週節數</th><th>生效日期</th><th>結束日期</th><th>狀態</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 專案基本資料 -->
    <section id="tab-projects" class="tab-panel">
      <div class="filters">
        <button id="btnNewProject">＋ 新增專案</button>
      </div>
      <table id="projectTable">
        <thead><tr><th>專案名稱</th><th>狀態</th><th>備註</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 單日例外 -->
    <section id="tab-dateRules" class="tab-panel">
      <div class="filters">
        <label><input id="filterIncludeCancelled" type="checkbox" /> 顯示已取消</label>
        <button id="btnNewDateRule">＋ 新增單日例外</button>
      </div>
      <table id="dateRuleTable">
        <thead><tr><th>日期</th><th>教師</th><th>節次</th><th>改判為</th><th>專案</th><th>備註</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 學校上課日曆 -->
    <section id="tab-calendar" class="tab-panel">
      <div class="filters">
        <select id="calendarMonthSelect"></select>
        <button id="btnGenerateCalendar">產生本學期日曆</button>
      </div>
      <div class="calendar-layout">
        <table id="calendarTable" class="calendar-table">
          <thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead>
          <tbody></tbody>
        </table>
        <aside id="calendarSummary" class="calendar-summary"></aside>
      </div>
    </section>

    <!-- 公費代課 Excel 匯入 -->
    <section id="tab-importExcel" class="tab-panel">
      <div class="import-form">
        <label>匯入年月
          <select id="importPeriodSelect"></select>
        </label>
        <label>Excel 檔案
          <input id="importFile" type="file" accept=".xlsx" />
        </label>
        <button id="btnInspectFile">下一步：選擇工作表</button>
      </div>

      <div id="sheetPickerForm" class="import-form" hidden>
        <label>要匯入的工作表
          <select id="importSheetSelect"></select>
        </label>
        <label>資料來源類型（僅為原始資料來源標記，不影響任何計算）
          <select id="importStaffTypeSelect">
            <option value="UNKNOWN">未指定</option>
            <option value="BD">編制內（BD）</option>
            <option value="NON_BD">編制外（非BD）</option>
          </select>
        </label>
        <button id="btnUploadImport">確認匯入這個工作表</button>
      </div>

      <div id="importResult" class="import-result" hidden>
        <h3>匯入結果</h3>
        <div id="importSummary"></div>
        <div id="importDetectedHeaders"></div>
        <table id="importErrorTable" class="import-error-table" hidden>
          <thead><tr><th>列</th><th>欄位</th><th>問題</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="importUnmatchedSection" hidden>
          <h4>未匹配教師</h4>
          <button id="btnAutoApplyMatches">套用系統偵測到的唯一比對建議</button>
          <table id="importUnmatchedTable">
            <thead><tr><th>原始姓名</th><th>欄位</th><th>候選人員</th><th>操作</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <h3>匯入批次紀錄</h3>
      <table id="importBatchTable">
        <thead><tr><th>年月</th><th>來源</th><th>版本</th><th>檔名</th><th>匯入時間</th><th>總筆數</th><th>成功</th><th>錯誤</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div id="modalBox" class="modal-box"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
